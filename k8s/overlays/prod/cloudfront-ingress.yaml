apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-cloudfront
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: d34lon2j81jxci.cloudfront.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  number: 80