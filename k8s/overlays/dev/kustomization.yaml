apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
  - path: nextcloud-patch.yaml

secretGenerator:
  - name: nextcloud-secrets
    behavior: merge
    literals:
      - MYSQL_ROOT_PASSWORD=DevRootPassword123!
      - MYSQL_PASSWORD=DevDbPassword123!
      - NEXTCLOUD_ADMIN_PASSWORD=DevAdminPassword123!

generatorOptions:
  disableNameSuffixHash: true