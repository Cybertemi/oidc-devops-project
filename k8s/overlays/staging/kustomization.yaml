apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
  - path: nextcloud-patch.yaml

secretGenerator:
  - name: nextcloud-secrets
    behavior: merge
    literals:
      - MYSQL_ROOT_PASSWORD=StagingRootPassword123!
      - MYSQL_PASSWORD=StagingDbPassword123!
      - NEXTCLOUD_ADMIN_PASSWORD=StagingAdminPassword123!

generatorOptions:
  disableNameSuffixHash: true